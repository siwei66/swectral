<!DOCTYPE html>
<html>
  <head>
    <title>Redirecting to Latest Documentation</title>
    <meta charset="utf-8">
    <script>
      async function redirectToLatest() {
        // Fallback version in case the network request fails
        const fallbackVersion = "master"; 
        const repoName = "swectral"; // Your repository name
        const githubUser = "siwei66"; // Your GitHub username

        try {
          // Fetch releases
          const response = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/releases/latest`);
          if (!response.ok) throw new Error();
          
          const data = await response.json();
          const latestTag = data.tag_name; // e.g., "v0.6.5"
          
          // Redirect to the latest stable release folder
          window.location.replace(`${latestTag}/index.html`);
        } catch (error) {
          // If no release is found or API limits hit, fall back to master
          window.location.replace(`${fallbackVersion}/index.html`);
        }
      }
      redirectToLatest();
    </script>
  </head>
  <body>
    <p>Redirecting to latest documentation...</p>
  </body>
</html>
