{% if versions %}
<div class="version-switcher__container dropdown">
  <button id="pst-version-switcher-button-2"
          type="button"
          class="version-switcher__button btn btn-sm dropdown-toggle pst-js-only"
          data-bs-toggle="dropdown"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="Version switcher">
    Choose Version
  </button>
  <div class="version-switcher__menu dropdown-menu list-group-flush py-0"
       aria-labelledby="pst-version-switcher-button-2">
    {%- for version in versions %}
    <a class="version-switcher__item dropdown-item list-group-item list-group-item-action py-1"
       href="{{ version.url }}">
      {{ version.name }} {% if version.is_released %}(released){% endif %}
    </a>
    {%- endfor %}
  </div>
</div>
{% endif %}
