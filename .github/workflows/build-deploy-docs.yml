name: Build and Deploy Documentation

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# Opt into Node.js 24 to resolve the deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install project with docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[docs]
          pip install sphinx-multiversion

      - name: Check links in documentation
        run: |
          cd docs
          make linkcheck  # SPHINXOPTS=-W

      - name: Build Multi-Version Sphinx documentation
        run: |
          cd docs
          sphinx-multiversion source build/html

      - name: Inject Global Version Switcher Script
        run: |
          # Copy the global version switcher script to the root deployment directory
          cp docs/version_switcher.js docs/build/html/
          # Find every HTML file across ALL compiled historical folders and inject the script reference right before the closing body tag
          find docs/build/html -name "*.html" -type f | xargs sed -i 's|</body>|<script src="/swectral/version_switcher.js"></script></body>|g'

      - name: Copy root redirect file
        run: |
          cp docs/index.html docs/build/html/

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4